name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          # setup-python only provides python 3.7 on ubuntu-22.04
          - os: ubuntu-22.04
            python-version: '3.7'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools_scm needs the full history to determine the version
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[extra]
          python -m pip install pytest openpyxl pyarrow
      - name: Run tests
        run: python -m pytest tests/ -v
